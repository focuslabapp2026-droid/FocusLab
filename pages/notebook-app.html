<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook • FocusLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="../style/main.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&family=Lora:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

</head>
<body class="nb-app">
<header id="top">
<div class="r1">
<button class="ib" id="lib" title="Back to library"><i data-i="l"></i><span>Library</span></button>
<div id="ttl"><b id="nbn">Notebook</b><small id="pn2"></small></div>
<span class="sp"></span>
<button class="ib" id="sbt" title="Page thumbnails"><i data-i="side"></i><span>Pages</span></button>
<button class="ib" id="zout" title="Zoom out"><i data-i="minus"></i><span>Zoom out</span></button>
<button class="ib" id="zin" title="Zoom in"><i data-i="plus"></i><span>Zoom in</span></button>
<button class="ib" id="undo" title="Undo"><i data-i="undo"></i><span>Undo</span></button>
<button class="ib" id="redo" title="Redo"><i data-i="redo"></i><span>Redo</span></button>
<button class="ib" id="clr" title="Clear page"><i data-i="trash"></i><span>Clear page</span></button>
<button class="ib" id="tplb" title="Page template"><i data-i="layout"></i><span>Template</span></button><select id="tpl" style="display:none">
<option value="ruledLight">White</option><option value="pdf" hidden>PDF page</option>
</select>
<label class="ib" id="addpdf" title="Import PDF" style="position:relative;cursor:pointer"><i data-i="file"></i><span>Add PDF</span><input type="file" id="pf" accept="application/pdf,.pdf"></label>
</div>
<div class="bar r3" id="fbar" style="display:none"><select id="ff"><option value="Inter">Modern</option><option value="Caveat">Handwriting</option><option value="Lora">Serif</option><option value="JetBrains Mono">Mono</option></select><input type="range" id="fsz" min="14" max="34" value="22"><span id="fv">22</span><button class="ib" id="fb" style="font-weight:800;font-size:16px;min-width:40px">B</button></div>
</header>
<div id="pbar" class="pbar"><span id="pgrip" title="Drag to move the toolbar"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span><div class="bar" id="tools"></div><div class="bar" id="cols"></div></div>
<div id="main"><aside id="sb"></aside>
<div id="sc"><div id="wrap"><div id="page" class="ruledLight">
<canvas id="bgc"></canvas><div id="tl"></div><div id="xl"></div><canvas id="cv"></canvas><canvas id="hc"></canvas>
</div></div></div></div>
<footer id="fbar2" class="fbar2"><span id="pgrip2" title="Drag to move this bar"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
<div class="bar">
<button class="ib" id="prev"><i data-i="l"></i></button>
<span id="pn">Page 1 / 1</span>
<button class="ib" id="next"><i data-i="r"></i></button>
<button class="ib" id="vmode" title="Scroll pages / Switch pages"><i data-i="scroll"></i><span>Scroll</span></button>
<button class="ib" id="addp" title="New page"><i data-i="plus"></i><span>New page</span></button>
<button class="ib" id="dupp" title="Duplicate page"><i data-i="copy"></i><span>Duplicate</span></button>
<button class="ib" id="expb" title="Download this notebook as a PDF (with your writing)"><i data-i="dl"></i><span>Download PDF</span></button>
<button class="ib" id="delp" title="Delete page"><i data-i="trash"></i><span>Delete page</span></button>
<button class="ib" id="closeb" title="Close book"><i data-i="lock"></i><span>Close book</span></button>
</div>
</footer>
<div id="md" hidden></div><div id="ts"></div><div id="tpop" hidden></div><div id="cpop" hidden></div>

<script src="../script/main.js"></script>
</body>
</html>
